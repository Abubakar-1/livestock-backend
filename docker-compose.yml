version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: livestock_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: livestock_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: livestock_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
